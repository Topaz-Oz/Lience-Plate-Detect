# Redis configuration optimized for LPR system
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec

# Performance tuning
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Snapshotting
save 900 1
save 300 10
save 60 10000

# Security
requirepass Redis@123

# Logging
loglevel notice
logfile /data/redis.log

# Slow log configuration
slowlog-log-slower-than 10000
slowlog-max-len 128

# Notification configuration
notify-keyspace-events Kx